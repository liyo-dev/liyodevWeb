<div class="page">
  <app-menu />
  <main>
    <router-outlet />
  </main>
  <footer>
    <div class="wrap foot">
      <span>Raúl Báez · Liyodev · Málaga</span>
      <a routerLink="/privacy-policy">{{ i18n.t('web.footer.privacy') }}</a>
    </div>
  </footer>

  <button type="button" class="to-top" [class.visible]="verArriba()" (click)="subir()"
          [attr.aria-label]="i18n.t('web.footer.top')" [title]="i18n.t('web.footer.top')"
          [attr.tabindex]="verArriba() ? 0 : -1">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
